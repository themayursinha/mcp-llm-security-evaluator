name: MCP LLM Security Evaluator CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  quality-and-test:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pytest-cov pip-audit

      - name: Dependency audit
        run: python -m pip_audit -r requirements.txt

      - name: Lint with flake8
        run: python -m flake8 app evaluator tests

      - name: Check formatting with black
        run: python -m black --check --target-version py311 app evaluator tests

      - name: Type check with mypy
        run: python -m mypy

      - name: Run tests with coverage
        run: python -m pytest --cov=app --cov=evaluator --cov-report=xml tests/

      - name: Generate HTML security report (Smoke test)
        run: python -m app.main --quick --format html --provider mock

      - uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5  # v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage.xml
          fail_ci_if_error: false

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        if: always()
        with:
          name: security-reports-python-${{ matrix.python-version }}
          path: reports/*.html
          retention-days: 7
