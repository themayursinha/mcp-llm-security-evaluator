name: MCP LLM Security Evaluator CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  quality-and-test:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6.0.3

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405  # v6.2.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pytest-cov

      - name: Lint with flake8
        run: python -m flake8 app evaluator tests

      - name: Check formatting with black
        run: python -m black --check --target-version py311 app evaluator tests

      - name: Type check with mypy
        run: python -m mypy

      - name: Run tests with coverage
        run: python -m pytest --cov=app --cov=evaluator --cov-report=xml tests/

      - name: Generate HTML security report (Smoke test)
        run: python -m app.main --quick --format html --provider mock

      - uses: codecov/codecov-action@e79a6962e0d4c0c17b229090214935d2e33f8354  # v6.0.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          file: ./coverage.xml
          fail_ci_if_error: false

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        if: always()
        with:
          name: security-reports-python-${{ matrix.python-version }}
          path: reports/*.html
          retention-days: 7
