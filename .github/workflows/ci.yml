name: MCP LLM Security Evaluator CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  quality-and-test:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pytest-cov pip-audit

      - name: Dependency audit
        run: python -m pip_audit -r requirements.txt

      - name: Lint with flake8
        run: python -m flake8 app evaluator tests

      - name: Check formatting with black
        run: python -m black --check --target-version py311 app evaluator tests

      - name: Type check with mypy
        run: python -m mypy

      - name: Run tests with coverage
        run: python -m pytest --cov=app --cov=evaluator --cov-report=xml tests/

      - name: Generate HTML security report (Smoke test)
        run: python -m app.main --quick --format html --provider mock

      - uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f  # v7.0.0
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage.xml
          fail_ci_if_error: false

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        if: always()
        with:
          name: security-reports-python-${{ matrix.python-version }}
          path: reports/*.html
          retention-days: 7
